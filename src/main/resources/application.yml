spring:
  application:
    name: ms-ofisy-notification
  main:
    allow-bean-definition-overriding: true

server:
  port: 8081

app:
  aws:
    sqs:
      notification-queue: techchallenge-ofisy-notifications-queue.fifo
    dynamodb:
      table-name: Notifications
  jwt:
    secret: ${APP_JWT_SECRET}
    issuer: ${APP_JWT_ISSUER:techchallenge-ofisy-auth}
