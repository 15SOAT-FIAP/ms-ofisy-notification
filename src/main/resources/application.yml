spring:
  application:
    name: ms-ofisy-notification
  main:
    allow-bean-definition-overriding: true
  cloud:
    aws:
      region:
        static: us-east-1
      sqs:
        queue-not-found-strategy: fail

server:
  port: 8080

app:
  aws:
    sqs:
      notification-queue: ofisy-notification.fifo
    dynamodb:
      table-name: Notifications
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${APP_JWT_ISSUER:techchallenge-ofisy-api}
