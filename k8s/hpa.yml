apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-ofisy-notification-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-ofisy-notification-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50