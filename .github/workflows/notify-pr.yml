name: Notify Discord on PR

on:
  pull_request:
    types: [opened, reopened, closed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_REPOSITORY: ${{ github.repository }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          def main():
              webhook = os.environ.get("DISCORD_WEBHOOK_URL", "")
              if not webhook:
                  print("DISCORD_WEBHOOK_URL is unavailable; skipping notification.")
                  return

              if os.environ["PR_ACTION"] in ("opened", "reopened"):
                  title, color = "🔔 Pull Request Aberto", 3447003
              elif os.environ["PR_MERGED"] == "true":
                  title, color = "✅ Pull Request Merged", 3066993
              else:
                  title, color = "❌ Pull Request Closed", 15158332

              payload = {"embeds": [{
                  "title": title,
                  "description": "**[{}]({})**".format(os.environ["PR_TITLE"], os.environ["PR_URL"]),
                  "color": color,
                  "fields": [
                      {"name": "Repositório", "value": os.environ["PR_REPOSITORY"], "inline": True},
                      {"name": "Branch", "value": "`{}` → `{}`".format(os.environ["PR_HEAD"], os.environ["PR_BASE"]), "inline": True},
                      {"name": "Autor", "value": os.environ["PR_AUTHOR"], "inline": True}
                  ]
              }]}
              request = urllib.request.Request(webhook,
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json", "User-Agent": "Ofisy-PR-Notification"},
                  method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      if not 200 <= response.status < 300:
                          raise RuntimeError("Unexpected HTTP status")
              except Exception:
                  # Exception URLs may contain the webhook secret.
                  raise SystemExit("Discord notification failed.") from None

          if __name__ == "__main__":
              main()
